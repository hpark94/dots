dpi-aware=no
horizontal-pad=20
vertical-pad=10
inner-pad=5
# Colors live in the generated current-mode fragment; fuzzel is spawned fresh
# per invocation so the include is always read current, needing no reload. The
# tracked [colors] block was removed outright: if the fragment is ever missing,
# fuzzel falls back loudly to its own built-in defaults rather than serving
# stale colors. fuzzel's include expands a leading ~/, and applies in place
# (last assignment wins), so it sits after every other default-section key.
include=~/.local/state/theme/fuzzel-colors.ini

[border]
    radius=0
    width=2
