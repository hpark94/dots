term=xterm-256color

font=Maple Mono NF:size=13
# line-height=<font metrics>
# letter-spacing=0
# horizontal-letter-offset=0
# vertical-letter-offset=0
# underline-offset=<font metrics>
# underline-thickness=<font underline thickness>
# strikeout-thickness=<font strikeout thickness>
# box-drawings-uses-font-glyphs=no
dpi-aware=no
# gamma-correct-blending=no

include=~/.local/state/theme/foot-colors.ini
pad=3x0
# bold-text-in-bright=no

# foot deletes TERM_PROGRAM from the environment it hands the shell, and `term`
# above renames TERM so ssh to hosts without foot terminfo keeps working, which
# together leave a foot window with nothing that names it. Putting back the
# variable ghostty and kitty already set is what lets fzf-preview pick the sixel
# renderer outside tmux; inside tmux tmux answers for itself (docs/adr/0007).
[environment]
TERM_PROGRAM=foot

[security]
osc52=enabled  # disabled|copy-enabled|paste-enabled|enabled
[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes
